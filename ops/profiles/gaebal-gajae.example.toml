# Example deployment profile. gajaeway hardcodes no persona, corpus, platform,
# or credential. Replace every /srv path and identifier for the real operator.
[corpus]
path = "/srv/gajaeway/corpus"
workspace = "/srv/gajaeway/workspace"

[injection]
# Ordered and digest-bound: SOUL -> USER -> daily(today + prior days) -> MEMORY.
files = ["SOUL.md", "USER.md", "daily/{date}.md", "MEMORY.md"]


[main_session]
# Select the live operator-owned GJC main session with `gjc sdk session list`.
# `gajaeway bootstrap --confirm` adopts this session; `gajaeway serve` re-verifies it.
session_id = "replace-with-gjc-session-id"

[security.restricted_files]
# These paths are relative to corpus.path. Keep private memory out of all
# non-owner construction paths.
main = []
conversation = ["MEMORY.md"]
lane = ["MEMORY.md"]
job = ["MEMORY.md"]
unknown = ["MEMORY.md"]

# `kind` is the free-form platform kind and is NEVER consulted for redaction.
# `session_kind` is the declared, digest-bound redaction class and selects the
# [restricted_files] deny list applied to this surface. It is required on every
# declared surface; there is no inferred default, because a wrong default would
# hand a surface the wrong deny list. An owner surface must declare "main".
[surfaces.owner]
id = "discord:owner-dm"
platform = "discord"
kind = "dm"
session_kind = "main"

# Non-owner routes are declared here. Membership is digest-bound: adding an
# entry changes the profile digest and requires `gajaeway profile approve`
# before the gateway will accept traffic from it.
# [[surfaces.known]]
# id = "discord:team-channel"
# platform = "discord"
# kind = "channel"
# session_kind = "conversation"

[operator]
# Any fields here are canonicalized into the digest-bound operator identity.
id = "gaebal-gajae-operator"
display_name = "Gaebal Gajae operator"

# Everything below is mutable tuning, excluded from the resume identity digest.
[tunables]
log_level = "info"

# `gajaeway mcp serve` exposes read-mostly gateway state as MCP tools over
# stdio. The single write tool `main_submit` is absent from tools/list unless
# write_enabled is true; it grants no authority the operator UID lacks, since it
# traverses the same main.submit admission path behind the same UDS
# peer-credential gate.
[tunables.mcp]
write_enabled = false

[tunables.metrics]
# Unauthenticated loopback Prometheus endpoint. Disabled by default: while it is
# enabled, any local process of any user can scrape gateway telemetry. Read the
# exposure section in ops/runbooks/operations.md before turning it on, and keep
# it off on multi-tenant or shared-login hosts. Enabling it changes no profile
# digest, so there is no `profile approve` receipt for this decision.
http_enabled = false
port = 9465

[poll]
interval_ms = 15000

[ack]
budget_ms = 2000

[policy]
# v1 records these generic policy tunables but does not activate v2 scheduling.
engagement_enabled = false

[adapter.discord]
# In systemd, LoadCredential supplies GAJAEWAY_DISCORD_TOKEN_FILE and takes
# precedence. This env-name fallback is convenient for local development only.
token_env = "GAJAEWAY_DISCORD_BOT_TOKEN"
channel_id = "123456789012345678"
surface_id = "discord:owner-dm"
ack_budget_ms = 2000
claim_ttl_ms = 5000
read_wait_ms = 1000