name: build

on:
  push:
  pull_request:

jobs:
  verify-pr-verdict:
    name: verify PR merge approval
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Fetch PR data and reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fetch PR data including reviews from GitHub API
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.'
            | jq --argjson reviews "$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews --paginate --jq '.[]'|jq -s .)" '. + {reviews: $reviews}')
          echo "$PR_DATA" > /tmp/pr-data.json
      - name: Verify PR merge approval
        run: bun run scripts/verify-pr-verdict.ts /tmp/pr-data.json

  test:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx biome ci packages/
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun test packages/
      # Frozen-corpus retrieval benchmark gate (separate from unit tests).
      - run: GAJAEWAY_BENCH=1 bun test packages/gateway/bench
