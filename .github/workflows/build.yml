name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-native.ts
      - run: bun scripts/compile.ts
      - run: cargo test -p way-core
      - run: bun test

  peer-auth-linux:
    name: linux-so-peercred-cross-user
    runs-on: ubuntu-24.04
    container: rust:latest
    steps:
      - uses: actions/checkout@v4
      - run: WAY_CORE_CROSS_UID_TEST=1 cargo test -p way-core rpc::auth::tests::linux_second_os_user_is_rejected_by_real_so_peercred_when_enabled -- --exact
