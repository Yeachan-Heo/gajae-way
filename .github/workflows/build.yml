name: build

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx biome ci packages/
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun test packages/
      # Frozen-corpus retrieval benchmark gate (separate from unit tests).
      - run: GAJAEWAY_BENCH=1 bun test packages/gateway/bench
      - run: scripts/smoke-binary.sh
