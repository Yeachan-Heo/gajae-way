name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag for the package publish (e.g. latest, next); empty derives next for a prerelease release and latest otherwise"
        required: false
        default: ""

# Every tagged release has to run: a tag push publishes that version's packages and
# creates its GitHub release, and a run that never starts does neither. GitHub keeps
# only one running and one pending run per concurrency group and drops the older
# pending one, so a single shared group let two later tags cancel an earlier pending
# tag's release. Key tagged runs by ref instead: reruns of the same tag still serialize
# (the script resumes an already-published version instead of republishing), while
# distinct tags never displace each other.
#
# A manual `workflow_dispatch` on a branch is a supported release request too, and it
# shares `github.ref` with every other dispatch from that branch. A group keyed by the
# branch would reproduce the same loss for manual releases: the second dispatch becomes
# pending while one is active, and a third replaces that pending run, so a distinct
# requested release never starts. A dispatch that requests no dist-tag is keyed by run
# instead and never coalesces. A dispatch that sets `npm_tag` is keyed by that tag
# instead, so runs from different branch refs that request the same dist-tag share one
# group and a run's read-then-write cannot interleave with another such writer. Runs that
# request the same tag queue behind each other, which also takes the single pending slot
# GitHub allows per group: only the newest pending same-tag request survives, so an older
# one has to be dispatched again. A dispatch run from a tag ref still shares that tag's
# queue, so a requested-tag group covers branch dispatches only. A concurrent dispatch
# that publishes the same version can fail its `npm publish`, which a rerun resumes and
# converges.
#
# Ordering the script has to do itself - a tag push against any other writer, or any
# write of a derived channel tag - is enforced there, not by GitHub: no write is decided
# below the tag's live pointer or, for the channel tags `latest` and `next`, below the
# highest published version in that channel. An explicit tag is re-read immediately
# before its write, so a release that already moved it is left on the newer version
# instead of being moved back. A tag a newer release already moved is left alone so its
# own GitHub release still gets created, an older fresh version is published under a
# scratch tag whose name is checked against the tag map read first, the channel tag a run
# writes is reconciled forward from the version list after that write, and the post-write
# read fails the run if that tag ends up below its channel floor (at least the version
# this run wrote) after a retried terminal read, or cannot be read at all.
# Serialization lives on the publishing job, not on the workflow: concurrency groups are
# matched case-insensitively, so a workflow-level group would let a case-variant tag
# (rejected by `canonical-tag`) queue ahead of a valid pending release and replace it.
# Gating the queue behind those checks means only accepted releases ever contend, and the
# requested-tag key is then the exact string the script publishes: the same job rejects an
# `npm_tag` with surrounding whitespace, which the resolver would trim to a different tag
# than the group it queued in.

jobs:
  # Runs the same verification the build workflow runs before anything is
  # published or released, so a red test/build never reaches the registry
  # or GitHub releases.
  verify:
    name: verify-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx biome ci packages/
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun test packages/

  canonical-tag:
    name: require canonical release inputs
    # Two spellings must never publish one tag from two queue keys. Concurrency groups are
    # matched case-insensitively, so a tag differing only in case (`v1.2.3-RC.1` vs
    # `v1.2.3-rc.1`) shares this ref's serialization group. A dispatch `npm_tag` with
    # whitespace has the same problem from the other side: the resolver trims its edges,
    # an interior newline splits the `tag=$TAG` output line, and the queue keys on the
    # value as written, so ` next ` and `next` (or `canary\ntag=next` and `next`) would
    # write one tag from groups that do not serialize. A leading `-` would be read as an
    # npm option. Both shapes are rejected here so they can never publish. The job itself
    # stays unconditional: a job-level `if` would make `needs` skip publishing for a branch
    # dispatch, which is a documented way to release, and the workflow would report success
    # with nothing published.
    runs-on: ubuntu-24.04
    steps:
      # The gate runs the predicate the release scripts use (`trim` edges, `\s` anywhere),
      # which covers Unicode spaces and separators (NBSP, U+2000-U+200A, U+3000, the BOM)
      # rather than an ASCII class. Bun is the runtime those scripts run on.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: require lowercase tag
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::release tags must be lowercase; got $GITHUB_REF_NAME"
            exit 1
          fi
      # The publish queue keys on `npm_tag` as written, so the accepted value must be the
      # exact string the resolver returns, the `tag=$TAG` output line uses, and the `--tag`
      # argument receives. Whitespace is trimmed by the resolver, splits the output line
      # (an interior newline can inject another output), and is rejected by the script's
      # own guard; a leading `-` would be read as an npm option. Reject both shapes before
      # the queue, mirroring `resolveEffectiveTag`.
      - name: require a canonical npm dist-tag
        env:
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
        run: |
          bun -e '
            const raw = process.env.NPM_TAG_INPUT ?? "";
            if (raw.startsWith("-")) {
              console.log("::error::npm_tag must not start with a hyphen");
              process.exit(1);
            }
            if (/\s/.test(raw)) {
              console.log("::error::npm_tag must not contain whitespace");
              process.exit(1);
            }
          '

  publish-npm:
    name: publish npm packages
    needs: [verify, canonical-tag]
    # Reruns of one immutable tag share a group so they publish one at a time; distinct
    # tags never contend, and nothing reaches this queue before the canonical-tag checks
    # accept it. A branch dispatch that names a dist-tag is grouped by that tag, so two
    # refs writing one custom tag serialize instead of interleaving a read and a write. A
    # dispatch that names none gets a run-scoped group: GitHub keeps only one pending run
    # per group, so a branch-keyed group would let a newer dispatch replace an earlier
    # pending release and skip its publish job entirely.
    concurrency:
      group: release-publish-${{ github.ref_type == 'tag' && github.ref || (inputs.npm_tag != '' && format('tag-{0}', inputs.npm_tag) || github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      npm-tag: ${{ steps.dist-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # npm >= 11.5.1 authenticates to the registry with this job's GitHub
      # OIDC token (trusted publishing, configured per package on npmjs.com)
      # and attaches provenance. No NPM_TOKEN or .npmrc is involved; do not
      # set setup-node's registry-url, which writes a token-based .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      # Publishes @gajae-gateway/protocol, @gajae-gateway/images, @gajae-gateway/sdk, and
      # @gajae-gateway/cli in dependency order via scripts/release-packages.ts --publish.
      # The script never touches the registry unless --publish is explicit.
      #
      # The dist-tag comes from scripts/release-dist-tag.ts, not from a `latest`
      # fallback: tag-triggered runs match `v*.*.*`, which includes prerelease tags
      # such as v1.2.3-rc.1, and the script treats an explicit --tag as opt-in. The
      # derivation sends a prerelease release to `next` so rerunning its tag cannot
      # promote it to latest.
      - name: Resolve npm dist-tag
        id: dist-tag
        env:
          NPM_TAG_INPUT: ${{ github.event.inputs.npm_tag }}
        run: |
          TAG="$(bun scripts/release-dist-tag.ts --requested "$NPM_TAG_INPUT")"
          echo "Publishing with npm dist-tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish protocol, images, sdk, cli (dependency order)
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: bun run release:publish -- --tag "$NPM_DIST_TAG"

  build-binaries:
    name: build-${{ matrix.platform }}-${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      # `bun build --compile` under 1.4.0 leaves a linker-signed Mach-O whose signature does
      # not match its contents. macOS kills it with SIGKILL (exit 137) at launch, and
      # `gajaeway update` then replaces a working install with binaries that cannot run.
      # 1.4.1 and later sign correctly. The darwin step below re-signs and verifies every
      # binary so a future bun regression fails this job instead of the release.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify darwin binary signatures
        if: matrix.platform == 'darwin'
        run: |
          for bin in dist/gajaeway dist/gajaeway-*; do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            codesign --force --sign - "$bin"
            codesign --verify --strict "$bin"
          done
          # Launching proves the kernel accepts the signature; --version exits 0.
          dist/gajaeway --version
      - name: Package binaries
        run: |
          mkdir -p release
          tar -czf "release/gajaeway-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: gajaeway-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.tar.gz
          if-no-files-found: error

  github-release:
    name: create GitHub release
    needs: [publish-npm, build-binaries]
    # A GitHub release needs a tag ref. Nothing `needs` this job, so skipping it on a
    # branch dispatch cannot propagate and the manual path still publishes and finishes
    # green.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
          draft: false
          # A tag push matches `v*.*.*` including prerelease tags, so the GitHub
          # release mirrors the npm dist-tag this run published with instead of
          # guessing from the tag name: one source of truth for both registries.
          prerelease: ${{ needs.publish-npm.outputs.npm-tag != 'latest' }}
