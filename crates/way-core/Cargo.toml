[package]
name = "way-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "way_core"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi10"] }
napi-derive = "3"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[build-dependencies]
napi-build = "2"
